<!-- Askhim the Wizard - Button & Modal for Elementor -->
<style>
  .askhim-button {
    background: linear-gradient(135deg, #6c63ff 0%, #0891B2 100%);
    color: white;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
    transition: all 0.3s ease;
    display: inline-block;
  }
  
  .askhim-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108, 99, 255, 0.6);
  }
  
  .askhim-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 999999;
    justify-content: center;
    align-items: center;
  }
  
  .askhim-modal.active {
    display: flex;
  }
  
  .askhim-modal-content {
    position: relative;
    width: 600px;
    height: 600px;
    background: transparent;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    transition: all 0.3s ease;
  }
  
  .askhim-modal-content.large {
    width: 90vw;
    height: 90vh;
    max-width: 1200px;
    max-height: 900px;
  }
  
  .askhim-close {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    font-size: 20px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.3s;
  }
  
  .askhim-close:hover {
    background: rgba(0, 0, 0, 0.8);
  }
  
  .askhim-modal iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  @media (max-width: 768px) {
    .askhim-modal-content {
      width: 95vw;
      height: 80vh;
    }
    .askhim-modal-content.large {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border-radius: 0;
    }
  }
</style>

<!-- Button -->
<div style="text-align: center; margin: 30px 0;">
  <button class="askhim-button" onclick="openAskhim()">
    ✨ Askhim Anything
  </button>
</div>

<!-- Modal -->
<div id="askhimModal" class="askhim-modal" onclick="closeAskhimOutside(event)">
  <div id="askhimModalContent" class="askhim-modal-content">
    <button class="askhim-close" onclick="closeAskhim()">&times;</button>
    <iframe src="YOUR_NETLIFY_URL_HERE" allow="clipboard-write"></iframe>
  </div>
</div>

<script>
  function openAskhim() {
    document.getElementById('askhimModal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  
  function closeAskhim() {
    document.getElementById('askhimModal').classList.remove('active');
    document.body.style.overflow = 'auto';
  }
  
  function closeAskhimOutside(event) {
    if (event.target.id === 'askhimModal') {
      closeAskhim();
    }
  }
  
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeAskhim();
    }
  });
  
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'resize-modal') {
      var modalContent = document.getElementById('askhimModalContent');
      if (event.data.size === 'large') {
        modalContent.classList.add('large');
      } else {
        modalContent.classList.remove('large');
      }
    }
  });
</script>
